[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-sentinel"
version = "0.1.0"
description = "Monitor unificado que orquesta senales de adi-shield, wallet-guard, goal-anchor y memlineage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Pedro Sordo Martínez (amurlaniakea@gmail.com)" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "bandit", "gitleaks"]
# Dependencias de INTEGRACION con el ecosistema local (no en PyPI).
# Install local para correr tests E2E de bus:
#   pip install -e ../adi-shield && pip install -e ../goal-anchor && pip install -e .
integration = ["adi-shield @ file:///home/sil/adi-shield",
               "goal-anchor @ file:///home/sil/goal-anchor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
skips = ["B101"]
